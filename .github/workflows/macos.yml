# macOS standalone: builds HARDER.app (Universal: arm64 + x86_64), runs the engine tests natively on Apple Silicon
# and under Rosetta, starts the app in self-test mode on both architectures, and uploads the zip + the logs.
# The job summary ("Summary" page of the run) collects every result in one place.
name: macOS standalone

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: write   # tag builds attach the zip to an existing release

defaults:
  run:
    shell: bash

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      SUM: ${{ github.workspace }}/summary.md
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain
        run: |
          sw_vers; uname -m; xcodebuild -version; clang --version | head -1
          { echo "## HARDER macOS build"; echo; echo "- runner: macOS $(sw_vers -productVersion) $(uname -m), $(xcodebuild -version | head -1), commit ${GITHUB_SHA::8}"; } >> "$SUM"

      - name: Patch DPF
        run: scripts/setup-dpf.sh

      - name: Build HARDER.app (Universal)
        run: |
          scripts/build.sh macos 2>&1 | tee build.log
          grep -E "warning:|error:" build.log | grep -v "/dpf/" | sort | uniq -c | sort -rn | head -40 > build-warnings.txt || true
          echo "- build: OK, $(wc -l < build-warnings.txt | tr -d ' ') distinct warnings outside DPF (build-warnings.txt)" >> "$SUM"

      - name: Check the bundle
        run: |
          A=bin-macos/HARDER.app; B=$A/Contents/MacOS/HARDER
          archs=$(lipo -archs "$B"); echo "archs: $archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          otool -L "$B" | tee otool.txt
          if grep -vE "^\S|/System/Library/|/usr/lib/" otool.txt; then echo "non-system library linked"; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$A"
          plutil -lint "$A/Contents/Info.plist"
          minos=$(otool -l "$B" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          echo "- bundle: $archs, minimum macOS $minos, system libraries only, signature valid, $(du -sh "$A" | cut -f1)" >> "$SUM"

      - name: Engine tests (Apple Silicon, native)
        run: |
          T=$RUNNER_TEMP/t-arm64
          CC=clang CXX=clang++ NO_VST3_HOST=1 tools/build_tools.sh "$T" > tools-arm64.log 2>&1 || { cat tools-arm64.log; exit 1; }
          tools/equiv.sh "$T/render" "$RUNNER_TEMP/eq-arm64" tools/expected/render-sha256.txt | tee eq-arm64.txt
          mkdir -p "$RUNNER_TEMP/v2" "$RUNNER_TEMP/smp" "$RUNNER_TEMP/fz"
          r() { echo "### $*"; "$@" 2>&1 | tail -n 3; return ${PIPESTATUS[0]}; }
          ( set -e
            r "$T/v2_test" "$RUNNER_TEMP/v2"
            r "$T/sample_test" "$RUNNER_TEMP/smp"
            r "$T/control_test"
            r "$T/sync_test"
            r "$T/preset_path_test" 0 1
            r "$T/host_echo_test" 1
            r "$T/core_test"
            r "$T/fuzz_parsers" 36000 "$RUNNER_TEMP/fz"
          ) | tee tests-arm64.txt
          echo "- arm64 engine: $(tail -n 1 eq-arm64.txt)" >> "$SUM"
          echo "- arm64 tests: all 8 suites passed (v2, sample, control, sync, preset path, host echo, core, fuzz 36000; tests-arm64.txt)" >> "$SUM"

      - name: Engine tests (x86_64 under Rosetta)
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then echo "- x86_64: Rosetta not available on this runner, skipped" >> "$SUM"; exit 0; fi
          T=$RUNNER_TEMP/t-x64
          CC=clang CXX=clang++ TOOLS_ARCH="-arch x86_64" NO_VST3_HOST=1 tools/build_tools.sh "$T" > tools-x64.log 2>&1 || { cat tools-x64.log; exit 1; }
          RUN="arch -x86_64" tools/equiv.sh "$T/render" "$RUNNER_TEMP/eq-x64" tools/expected/render-sha256.txt | tee eq-x64.txt
          mkdir -p "$RUNNER_TEMP/v2x"
          arch -x86_64 "$T/v2_test" "$RUNNER_TEMP/v2x" 2>&1 | tail -n 2 | tee tests-x64.txt
          echo "- x86_64 engine (Rosetta): $(tail -n 1 eq-x64.txt); v2_test: $(tail -n 1 tests-x64.txt)" >> "$SUM"

      - name: Audio device for the app test (BlackHole)
        continue-on-error: true
        run: |
          brew install --cask blackhole-2ch > blackhole.log 2>&1 || { tail -n 20 blackhole.log; exit 1; }
          sudo killall coreaudiod || true; sleep 5
          system_profiler SPAudioDataType | grep -E "^\s+\S.*:$" | head -20

      - name: Run the app (self-test, arm64 and x86_64)
        run: |
          B=bin-macos/HARDER.app/Contents/MacOS/HARDER; mkdir -p shots; fail=0
          for a in arm64 x86_64; do
            if [ $a = x86_64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then continue; fi
            # HOME is the folder the app uses (~/Documents/HARDER): a fresh one, without even a Documents folder
            H=$RUNNER_TEMP/home-$a; rm -rf "$H"; mkdir -p "$H"
            HOME=$H HARDER_SELFTEST=$H/selftest.json arch -$a "$B" > "app-$a.log" 2>&1 &
            pid=$!
            for i in $(seq 1 60); do { [ -f "$H/selftest.json.ready" ] || ! kill -0 $pid 2>/dev/null; } && break; sleep 0.5; done
            screencapture -x "shots/HARDER-$a.png" 2>/dev/null || echo "screencapture failed" >> "app-$a.log"
            ok=0; for i in $(seq 1 60); do if ! kill -0 $pid 2>/dev/null; then ok=1; break; fi; sleep 0.5; done
            if [ $ok = 0 ]; then kill -9 $pid; fi
            rc=0; wait $pid || rc=$?
            cp "$H/selftest.json" "selftest-$a.json" 2>/dev/null || true
            files=$(ls "$H/Documents/HARDER" 2>/dev/null | tr '\n' ' ')
            line="- app $a: $([ $ok = 1 ] && echo "exit code $rc" || echo "did not quit within 30 s (killed)"); ready marker: $([ -f "$H/selftest.json.ready" ] && echo yes || echo no); report: \`$(cat "$H/selftest.json" 2>/dev/null || echo none)\`; files in Documents/HARDER: ${files:-none}"
            echo "$line" | tee -a "$SUM"
            echo "--- app-$a.log (last 40 lines)"; tail -n 40 "app-$a.log"
            [ $ok = 1 ] && [ $rc = 0 ] && [ -f "$H/selftest.json" ] && [ -f "$H/Documents/HARDER/autosave.json" ] || fail=1
          done
          if ls ~/Library/Logs/DiagnosticReports/HARDER* 2>/dev/null; then echo "- crash reports found (in logs-and-screenshots)" | tee -a "$SUM"; cp ~/Library/Logs/DiagnosticReports/HARDER* shots/; fail=1; fi
          exit $fail

      - name: Package
        run: |
          scripts/package-macos.sh | tee package.txt
          echo "- package: \`$(tail -n 1 package.txt)\`" >> "$SUM"

      - name: Attach to the release (tag builds, when the release exists)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then gh release upload "$GITHUB_REF_NAME" dist/HARDER-*-macos.zip --clobber; echo "- attached to release $GITHUB_REF_NAME" >> "$SUM"
          else echo "- no release $GITHUB_REF_NAME yet: download the artifact and attach it by hand" >> "$SUM"; fi

      - name: Summary
        if: always()
        run: cat "$SUM" >> "$GITHUB_STEP_SUMMARY"; cat "$SUM"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HARDER-macos
          path: dist/HARDER-*-macos.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-screenshots
          path: |
            summary.md
            build.log
            build-warnings.txt
            otool.txt
            eq-*.txt
            tests-*.txt
            tools-*.log
            app-*.log
            selftest-*.json
            shots/
          if-no-files-found: ignore
